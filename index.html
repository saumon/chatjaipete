    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: #212121;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Header avec l'icône et le nom ChatJaiPété */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo {
            width: 32px;
            height: 32px;
            background: transparent;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: white;
        }

        .logo svg {
            width: 20px;
            height: 20px;
            color: white;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        .dropdown-arrow {
            margin-left: 4px;
            font-size: 12px;
            color: #8e8ea0;
        }



        /* Main content */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            width: 100%;
            max-width: 768px;
            padding: 0 20px;
        }

        .main-title {
            font-size: 32px;
            font-weight: 400;
            text-align: center;
            color: #ffffff;
            line-height: 1.2;
        }

        /* Input container */
        .input-container {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .input-wrapper {
            background: #2f2f2f;
            border-radius: 24px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #404040;
            transition: border-color 0.2s ease;
            min-height: 60px;
            box-sizing: border-box;
        }

        .input-wrapper:focus-within {
            border-color: #565656;
        }

        .attach-icon {
            width: 20px;
            height: 20px;
            color: #8e8ea0;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            flex-shrink: 0;
        }

        .attach-icon:hover {
            color: #ffffff;
        }

        .message-input {
            flex: 1;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            font-family: inherit;
        }

        .message-input::placeholder {
            color: #8e8ea0;
        }



        .send-button {
            width: 20px;
            height: 20px;
            color: #8e8ea0;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
        }

        .send-button:hover {
            color: #ffffff;
        }

        /* Nouveau bouton d'envoi qui apparaît quand il y a du texte */
        .composer-submit-btn {
            width: 36px;
            height: 36px;
            background: #ffffff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease, transform 0.2s ease;
            flex-shrink: 0;
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }

        .composer-submit-btn:hover {
            background: #f0f0f0;
        }

        .composer-submit-btn.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .composer-submit-btn svg {
            color: #2f2f2f;
        }

        .composer-submit-button-color {
            background: #ffffff;
        }

        /* Animation des smileys */
        .emoji-animation {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            height: 60px;
            position: relative;
        }

        .emoji-animation.show {
            display: flex;
        }

        .emoji-container {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .emoji {
            font-size: 32px;
            animation: bounce 0.6s ease-in-out infinite alternate;
            opacity: 0.8;
        }

        .emoji:nth-child(1) { animation-delay: 0s; }
        .emoji:nth-child(2) { animation-delay: 0.1s; }
        .emoji:nth-child(3) { animation-delay: 0.2s; }
        .emoji:nth-child(4) { animation-delay: 0.3s; }
        .emoji:nth-child(5) { animation-delay: 0.4s; }

        @keyframes bounce {
            from {
                transform: translateY(0) scale(1);
                opacity: 0.8;
            }
            to {
                transform: translateY(-10px) scale(1.1);
                opacity: 1;
            }
        }

        .input-container.hidden {
            display: none;
        }

        /* Animation des points de chargement */
        .loading-dots {
            font-size: 32px;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 4px;
        }

        .loading-dots .dot {
            animation: blink 1.4s ease-in-out infinite both;
        }

        .loading-dots .dot:nth-child(1) { animation-delay: 0s; }
        .loading-dots .dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            40% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-title {
                font-size: 28px;
            }

            .input-container {
                max-width: 100%;
            }
        }

        /* Icons using Unicode symbols */
        .icon-plus::before { content: "+"; }
    </style>
</head>

    <script>
        // Liste des sons disponibles
        const availableSounds = [
            'bubbly_fart.mp3',
            'cartoon_fart.mp3',
            'classic_fart.mp3',
            'deep_bass_fart.mp3',
            'epic_thunder_fart.mp3',
            'explosive_fart.mp3',
            'gentle_puff.mp3',
            'high_pitched_squeak.mp3',
            'juicy_fart.mp3',
            'long_rumbling_fart.mp3',
            'mega_blast.mp3',
            'rapid_fire_farts.mp3',
            'short_toot.mp3',
            'silent_but_deadly.mp3',
            'squeaky_mouse_fart.mp3',
            'surprised_toot.mp3',
            'tiny_poot.mp3',
            'trumpet_fart.mp3',
            'volcanic_eruption.mp3',
            'wet_squishy_fart.mp3',
            'whoopee_cushion.mp3',
            'windy_fart.mp3'
        ];

        // Fonction pour afficher l'animation des smileys
        function showEmojiAnimation() {
            const inputContainer = document.querySelector('.input-container');
            const emojiAnimation = document.querySelector('#emoji-animation');
            const mainTitle = document.querySelector('.main-title');
            
            // Masquer le champ de saisie
            inputContainer.classList.add('hidden');
            // Afficher l'animation
            emojiAnimation.classList.add('show');
            
            // Remplacer le titre par les points animés
            mainTitle.innerHTML = '<span class="loading-dots"><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>';
        }

        // Fonction pour masquer l'animation des smileys
        function hideEmojiAnimation() {
            const inputContainer = document.querySelector('.input-container');
            const emojiAnimation = document.querySelector('#emoji-animation');
            const mainTitle = document.querySelector('.main-title');
            
            // Afficher le champ de saisie
            inputContainer.classList.remove('hidden');
            // Masquer l'animation
            emojiAnimation.classList.remove('show');
            
            // Restaurer le titre original
            mainTitle.innerHTML = 'Quel est le programme aujourd\'hui ?';
        }

        // Fonction pour jouer une suite de sons aléatoires
        function playRandomSounds() {
            // Afficher l'animation
            showEmojiAnimation();
            
            // Nombre aléatoire de sons à jouer (entre 2 et 5)
            const numberOfSounds = Math.floor(Math.random() * 4) + 2;
            let soundsFinished = 0;
            const audioObjects = [];
            
            // Fonction appelée quand un son se termine
            function onSoundEnded() {
                soundsFinished++;
                if (soundsFinished === numberOfSounds) {
                    // Tous les sons sont terminés, attendre un peu puis masquer l'animation
                    setTimeout(() => {
                        hideEmojiAnimation();
                    }, 500);
                }
            }
            
            // Jouer les sons avec des délais aléatoires
            for (let i = 0; i < numberOfSounds; i++) {
                setTimeout(() => {
                    // Sélectionner un son aléatoire
                    const randomSound = availableSounds[Math.floor(Math.random() * availableSounds.length)];
                    const audio = new Audio(`assets/sounds/${randomSound}`);
                    
                    // Régler le volume (entre 0.3 et 0.8)
                    audio.volume = Math.random() * 0.5 + 0.3;
                    
                    // Écouter la fin du son
                    audio.addEventListener('ended', onSoundEnded);
                    audio.addEventListener('error', onSoundEnded); // En cas d'erreur, compter aussi comme terminé
                    
                    // Stocker la référence audio
                    audioObjects.push(audio);
                    
                    // Jouer le son
                    audio.play().catch(error => {
                        console.log('Erreur lors de la lecture du son:', error);
                        onSoundEnded(); // Compter comme terminé en cas d'erreur
                    });
                }, i * (Math.random() * 1000 + 500)); // Délai aléatoire entre 500ms et 1500ms
            }
        }

        // Fonction pour gérer l'envoi du message
        function handleSendMessage() {
            const input = document.querySelector('.message-input');
            const message = input.value.trim();
            
            if (message) {
                console.log('Message envoyé:', message);
                
                // Jouer la suite de sons aléatoires
                playRandomSounds();
                
                input.value = '';
                // Masquer le bouton après envoi
                toggleSendButton();
            }
        }

        // Fonction pour afficher/masquer le bouton d'envoi
        function toggleSendButton() {
            const input = document.querySelector('.message-input');
            const sendButton = document.querySelector('#composer-submit-button');
            
            if (input.value.trim().length > 0) {
                sendButton.classList.add('show');
            } else {
                sendButton.classList.remove('show');
            }
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.querySelector('.message-input');
            const sendButton = document.querySelector('#composer-submit-button');
            
            // Afficher/masquer le bouton selon le contenu
            input.addEventListener('input', toggleSendButton);
            input.addEventListener('keyup', toggleSendButton);
            
            // Envoyer avec Entrée
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    handleSendMessage();
                }
            });
            
            // Envoyer avec le bouton
            sendButton.addEventListener('click', handleSendMessage);
            
            // Focus automatique sur l'input
            input.focus();
        });
    </script>
</body>
</html>
